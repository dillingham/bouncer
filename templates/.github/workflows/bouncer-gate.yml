# Bouncer gate. Copy into your repository unchanged.
name: Bouncer gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Check one pull request now (optional)
        required: false
        type: string

permissions: {}

concurrency:
  group: bouncer-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || 'sweep' }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/bouncer'))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      attestations: read
      id-token: write
    uses: pr-bouncer/bouncer/.github/workflows/gate.yml@v1

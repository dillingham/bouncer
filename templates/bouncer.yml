# Bouncer: https://github.com/gh-bouncer/gh-bouncer
# In this repository, the bouncer holds outside pull requests until they pass a signed review.
# In forks, the review runs on the contributor's own ANTHROPIC_API_KEY (via `gh bouncer`).
name: Bouncer
# Fork runs: "Bouncer review · PR #7" (gh bouncer finds its run by this), or "Bouncer review" on a push.
# Upstream runs: "Bouncer gate · PR #7", or "Bouncer gate" for the scheduled check of all waiting PRs.
run-name: >-
  ${{ github.event.repository.fork
      && (inputs.pr && format('Bouncer review · PR #{0}', inputs.pr) || 'Bouncer review')
      || ((github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || inputs.pr)
          && format('Bouncer gate · PR #{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr)
          || 'Bouncer gate') }}

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]  # edited: e.g. a new base branch
  issue_comment:
    types: [created]
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: false
        type: string
      upstream:
        description: Repository the pull request is in (owner/repo), if not this fork's parent
        required: false
        type: string
  push:

permissions: {}

jobs:
  gate:
    name: Bouncer gate
    if: >-
      !github.event.repository.fork && (
        github.event_name == 'pull_request_target' ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/bouncer'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: bouncer-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || 'sweep' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      attestations: read
    steps:
      - uses: gh-bouncer/action@v1

  review:
    name: Bouncer review
    if: github.event.repository.fork && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: gh-bouncer/action/.github/workflows/review.yml@v1
    with:
      pr: ${{ inputs.pr || '' }}
      upstream: ${{ inputs.upstream || '' }}
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
